<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Physics Simulation</h1>
        <div class="content">
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>
            <div class="controls">
                <h2>Controls</h2>
                
                <div class="control-group">
                    <label for="gravity">Gravity: <span id="gravityValue">0.5</span></label>
                    <input type="range" id="gravity" min="0" max="2" step="0.1" value="0.5">
                </div>
                
                <div class="control-group">
                    <label for="friction">Friction: <span id="frictionValue">0.98</span></label>
                    <input type="range" id="friction" min="0.8" max="1" step="0.01" value="0.98">
                </div>
                
                <div class="control-group">
                    <label for="restitution">Bounciness: <span id="restitutionValue">0.7</span></label>
                    <input type="range" id="restitution" min="0" max="1" step="0.05" value="0.7">
                </div>
                
                <div class="button-group">
                    <button id="spawnCircle">Spawn Circle</button>
                    <button id="spawnBox">Spawn Box</button>
                    <button id="reset">Reset Scene</button>
                </div>
                
                <div class="info">
                    <h3>Instructions</h3>
                    <p><strong>Click on canvas</strong> to spawn objects at mouse position</p>
                    <p><strong>Adjust sliders</strong> to change physics parameters</p>
                    <p><strong>Reset</strong> to clear all objects</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/Vector2D.js"></script>
    <script src="js/PhysicsObject.js"></script>
    <script src="js/PhysicsEngine.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/UIController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
